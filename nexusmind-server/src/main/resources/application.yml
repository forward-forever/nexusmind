spring:
  application:
    name: nexusmind-server
  servlet:
    multipart:
      max-file-size: ${NEXUSMIND_MAX_FILE_SIZE:20MB}
      max-request-size: ${NEXUSMIND_MAX_FILE_SIZE:20MB}
  ai:
    mcp:
      client:
        enabled: ${NEXUSMIND_MCP_ENABLED:false}
        initialized: true
        type: SYNC
        request-timeout: ${MCP_REQUEST_TIMEOUT:8s}
        toolcallback:
          enabled: true
        streamable-http:
          connections:
            # 配置MCP Demo连接
            demo:
              url: ${MCP_DEMO_BASE_URL:}
              endpoint: ${MCP_DEMO_ENDPOINT:}
      server:
        enabled: false
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    # NexusMind owns provider retry classification and streaming side-effect boundaries.
    openai:
      chat:
        max-retries: 0
      embedding:
        max-retries: 0

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    description: NexusMind AI Knowledge & Agent Platform

nexusmind:
  mcp:
    enabled: ${NEXUSMIND_MCP_ENABLED:false}
    allowed-tools: ${MCP_ALLOWED_TOOLS:mcp_12306_mcp_get_current_date,mcp_12306_mcp_get_interline_tickets,mcp_12306_mcp_get_station_by_telecode,mcp_12306_mcp_get_station_code_by_names,mcp_12306_mcp_get_station_code_of_citys,mcp_12306_mcp_get_stations_code_in_city,mcp_12306_mcp_get_tickets,mcp_12306_mcp_get_train_route_stations}
    request-timeout: ${MCP_REQUEST_TIMEOUT:8s}
  document-task:
    enabled: false
    worker-enabled: true
    worker-concurrency: 2
    poll-interval: 1s
    heartbeat-interval: 10s
    stale-after: 5m
    recovery-interval: 30s
    max-stale-recoveries: 3
    shutdown-await: 30s
  agent:
    enabled: false
    max-tool-calls: 5
    max-duration: 30s
    knowledge-search:
      retriever: DENSE
      top-k: 5
    document-context:
      before-chunks: 1
      after-chunks: 1
    memory:
      max-messages: 12
      max-tokens: 6000
    session-concurrency:
      lease-duration: 45s
    tool-result:
      max-tokens-per-call: 5000
      max-tokens-per-run: 12000
  agent-evaluation:
    enabled: false
  dataset-resolver:
    enabled: false
  evaluation:
    enabled: false
  rebuild:
    enabled: false
  vector:
    enabled: false
  ai:
    context:
      max-context-tokens: 32768
      reserved-output-tokens: 4096
      safety-margin-tokens: 4096
      tool-definition-reserve-tokens: 4096
    resilience:
      max-retries: 2
      initial-delay: 200ms
      multiplier: 2.0
      max-delay: 2s
      jitter: 100ms
    embedding:
      model: qwen3.7-text-embedding-flash
      dimension: 1024
      batch-size: 15
      max-batch-chars: 7500
    chat:
      model: qwen3.5-flash
      temperature: 0.2
      default-top-k: 5
      max-top-k: 10
      max-context-chars: 12000
      stream-timeout: 120s
      mvc-timeout: 150s
    rerank:
      enabled: ${NEXUSMIND_RERANK_ENABLED:false}
      model: qwen3.7-text-rerank
      base-url: ${RERANK_BASE_URL:}
      api-key: ${DASHSCOPE_API_KEY:}
      timeout: ${RERANK_TIMEOUT:3s}
      instruct: Given a web search query, retrieve relevant passages that answer the query.
  rag:
    enabled: false
    retriever: DENSE
    context:
      max-tokens: 12000
    hybrid:
      rrf:
        k: 60
      route-candidate-multiplier: 4
      min-route-candidates: 20
      max-route-candidates: 60
      parallel:
        enabled: true
        core-pool-size: 4
        max-pool-size: 4
        queue-capacity: 50
    rerank:
      candidate-top-n: 20
      max-candidate-top-n: 50
  milvus:
    enabled: false
    uri: ${MILVUS_URI:http://localhost:19530}
    content-max-length: 8192
    ready-timeout: 30s
    hnsw:
      m: 32
      ef-construction: 200
      ef: 64
    bm25:
      inverted-index-algo: DAAT_MAXSCORE
      k1: 1.2
      b: 0.75
      analyzer: chinese
  storage:
    root: ${NEXUSMIND_STORAGE_ROOT:${user.home}/.nexusmind/storage}
    max-file-size: ${NEXUSMIND_MAX_FILE_SIZE:20MB}
  chunking:
    chunk-size-chars: ${NEXUSMIND_CHUNK_SIZE_CHARS:500}
    chunk-overlap-chars: ${NEXUSMIND_CHUNK_OVERLAP_CHARS:100}

---
spring:
  config:
    activate:
      on-profile: default
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
