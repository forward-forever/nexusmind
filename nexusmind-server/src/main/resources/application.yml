spring:
  application:
    name: nexusmind-server
  servlet:
    multipart:
      max-file-size: ${NEXUSMIND_MAX_FILE_SIZE:20MB}
      max-request-size: ${NEXUSMIND_MAX_FILE_SIZE:20MB}
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    description: NexusMind AI Knowledge & Agent Platform

nexusmind:
  vector:
    enabled: false
  ai:
    embedding:
      model: qwen3.7-text-embedding-flash
      dimension: 1024
      batch-size: 15
  milvus:
    enabled: false
    uri: ${MILVUS_URI:http://localhost:19530}
    content-max-length: 8192
    ready-timeout: 30s
    hnsw:
      m: 32
      ef-construction: 200
      ef: 64
  storage:
    root: ${NEXUSMIND_STORAGE_ROOT:${user.home}/.nexusmind/storage}
    max-file-size: ${NEXUSMIND_MAX_FILE_SIZE:20MB}
  chunking:
    chunk-size-chars: ${NEXUSMIND_CHUNK_SIZE_CHARS:500}
    chunk-overlap-chars: ${NEXUSMIND_CHUNK_OVERLAP_CHARS:100}

---
spring:
  config:
    activate:
      on-profile: default
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
