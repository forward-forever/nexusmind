spring:
  application:
    name: nexusmind-server
  servlet:
    multipart:
      max-file-size: ${NEXUSMIND_MAX_FILE_SIZE:20MB}
      max-request-size: ${NEXUSMIND_MAX_FILE_SIZE:20MB}
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    description: NexusMind AI Knowledge & Agent Platform

nexusmind:
  agent:
    enabled: false
    max-tool-calls: 5
    max-duration: 30s
    knowledge-search:
      retriever: DENSE
      top-k: 5
    document-context:
      before-chunks: 1
      after-chunks: 1
    memory:
      max-messages: 12
  agent-evaluation:
    enabled: false
  dataset-resolver:
    enabled: false
  evaluation:
    enabled: false
  rebuild:
    enabled: false
  vector:
    enabled: false
  ai:
    embedding:
      model: qwen3.7-text-embedding-flash
      dimension: 1024
      batch-size: 15
      max-batch-chars: 7500
    chat:
      model: qwen3.5-flash
      temperature: 0.2
      default-top-k: 5
      max-top-k: 10
      max-context-chars: 12000
      stream-timeout: 120s
      mvc-timeout: 150s
    rerank:
      enabled: ${NEXUSMIND_RERANK_ENABLED:false}
      model: qwen3.7-text-rerank
      base-url: ${RERANK_BASE_URL:}
      api-key: ${DASHSCOPE_API_KEY:}
      timeout: ${RERANK_TIMEOUT:3s}
      instruct: Given a web search query, retrieve relevant passages that answer the query.
  rag:
    enabled: false
    retriever: DENSE
    hybrid:
      rrf:
        k: 60
      route-candidate-multiplier: 4
      min-route-candidates: 20
      max-route-candidates: 60
    rerank:
      candidate-top-n: 20
      max-candidate-top-n: 50
  milvus:
    enabled: false
    uri: ${MILVUS_URI:http://localhost:19530}
    content-max-length: 8192
    ready-timeout: 30s
    hnsw:
      m: 32
      ef-construction: 200
      ef: 64
    bm25:
      inverted-index-algo: DAAT_MAXSCORE
      k1: 1.2
      b: 0.75
      analyzer: chinese
  storage:
    root: ${NEXUSMIND_STORAGE_ROOT:${user.home}/.nexusmind/storage}
    max-file-size: ${NEXUSMIND_MAX_FILE_SIZE:20MB}
  chunking:
    chunk-size-chars: ${NEXUSMIND_CHUNK_SIZE_CHARS:500}
    chunk-overlap-chars: ${NEXUSMIND_CHUNK_OVERLAP_CHARS:100}

---
spring:
  config:
    activate:
      on-profile: default
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
