spring:
  application:
    name: nexusmind-server
  servlet:
    multipart:
      max-file-size: ${NEXUSMIND_MAX_FILE_SIZE:20MB}
      max-request-size: ${NEXUSMIND_MAX_FILE_SIZE:20MB}
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    description: NexusMind AI Knowledge & Agent Platform

nexusmind:
  storage:
    root: ${NEXUSMIND_STORAGE_ROOT:${user.home}/.nexusmind/storage}
    max-file-size: ${NEXUSMIND_MAX_FILE_SIZE:20MB}
  chunking:
    chunk-size-chars: ${NEXUSMIND_CHUNK_SIZE_CHARS:1000}
    chunk-overlap-chars: ${NEXUSMIND_CHUNK_OVERLAP_CHARS:150}

---
spring:
  config:
    activate:
      on-profile: default
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
